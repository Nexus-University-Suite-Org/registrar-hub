<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- TODO: Update title dynamically based on branding settings -->
    <title>Academic Portal</title>
    <meta name="description" content="Academic Portal" />
    <meta name="author" content="Your Institution" />

    <!-- TODO: Update og:title and og:description dynamically -->
    <meta property="og:title" content="Academic Portal" />
    <meta property="og:description" content="Academic Portal" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="" />
    <meta name="twitter:image" content="" />

    <!-- TODO: Update favicon dynamically if custom favicon is uploaded -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' width='256' height='256' fill='none'%3e%3cpath d='M 0 128 C 70.692 128 128 185.308 128 256 L 64 256 C 64 220.654 35.346 192 0 192 Z M 256 192 C 220.654 192 192 220.654 192 256 L 128 256 C 128 185.308 185.308 128 256 128 Z M 128 0 C 128 70.692 70.692 128 0 128 L 0 64 C 35.346 64 64 35.346 64 0 Z M 192 0 C 192 35.346 220.654 64 256 64 L 256 128 C 185.308 128 128 70.692 128 0 Z' fill='%23f97316'/%3e%3c/svg%3e"
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Update meta tags dynamically when branding changes
      window.updateMetaTags = function (branding) {
        document.title = branding.siteName;
        const metaDesc = document.querySelector('meta[name="description"]');
        if (metaDesc)
          metaDesc.setAttribute("content", branding.metaDescription);
        const ogTitle = document.querySelector('meta[property="og:title"]');
        if (ogTitle) ogTitle.setAttribute("content", branding.siteName);
        const ogDesc = document.querySelector(
          'meta[property="og:description"]',
        );
        if (ogDesc) ogDesc.setAttribute("content", branding.metaDescription);
        if (branding.ogImageUrl) {
          const ogImage = document.querySelector('meta[property="og:image"]');
          if (ogImage) ogImage.setAttribute("content", branding.ogImageUrl);
          const twitterImage = document.querySelector(
            'meta[name="twitter:image"]',
          );
          if (twitterImage)
            twitterImage.setAttribute("content", branding.ogImageUrl);
        }
        if (branding.faviconUrl) {
          const favicon = document.querySelector('link[rel="icon"]');
          if (favicon) {
            favicon.href = branding.faviconUrl;
          }
        }
      };
    </script>
  </body>
</html>
