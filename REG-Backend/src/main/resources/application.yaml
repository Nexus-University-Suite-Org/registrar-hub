spring:
  application:
    name: REG-Backend

  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

nexus-identity:
  issuer-uri: ${NEXUS_IDENTITY_ISSUER_URI:http://localhost:9000}
  audience: ${NEXUS_IDENTITY_AUDIENCE:nexus-registrar}

server:
  port: ${PORT:8082}

# â”€â”€ Lecturer-Backend proxy â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
# ── CORS ─────────────────────────────────────────────────────────────────────
reg:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:5176,http://localhost:5177,http://localhost:5178,http://127.0.0.1:5173,http://127.0.0.1:5174,http://127.0.0.1:5175,http://127.0.0.1:5176,http://127.0.0.1:5177,http://127.0.0.1:5178}

# ── Lecturer-Backend proxy ─────────────────────────────────────────────────
lecturer:
  base-url: ${LECTURER_BASE_URL:http://localhost:8084}

# â”€â”€ NAP program catalog sync â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
nap:
  base-url: ${NAP_BASE_URL:http://localhost:8080}
  endpoint: ${NAP_PROGRAMS_ENDPOINT:/api/v1/programs}
  college: ${NAP_DEFAULT_COLLEGE:Alvin University}
  sync-interval-ms: ${NAP_SYNC_INTERVAL_MS:3600000}   # 1 hour

# â”€â”€ JWT settings â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
jwt:
  secret: ${JWT_SECRET:reg-backend-dev-jwt-secret-change-in-production}
  access-token-expiry-ms: 900000       # 15 minutes
  refresh-token-expiry-ms: 604800000   # 7 days

# â”€â”€ OTP settings â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
otp:
  secret: ${OTP_SECRET:reg-backend-dev-otp-secret-change-in-production}
  expiry-minutes: 10
  resend-cooldown-seconds: 60
  max-sends-per-hour: 5
  max-verify-attempts: 5
  # Set to true ONLY in local dev to include raw OTP in response
  show-in-dev: ${OTP_SHOW_IN_DEV:false}

# â”€â”€ File upload â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
file:
  upload:
    dir: uploads

# â”€â”€ Set password â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
set-password:
  url: ${SET_PASSWORD_URL:http://localhost:5176/set-password}

# REG_UCD_001 â€” Actuator: expose health endpoint for internal deployment checks only.
# The public health check is served by HealthController at /api/health.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

---
# Activated on Railway via SPRING_PROFILES_ACTIVE=postgres.
# Railway exposes DATABASE_URL as "postgresql://...", which is not a valid JDBC
# URL, so the connection is assembled from the PG* variables instead.
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}
    username: ${PGUSER}
    password: ${PGPASSWORD}
