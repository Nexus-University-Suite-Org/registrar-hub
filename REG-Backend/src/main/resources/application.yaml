spring:
  application:
    name: REG-Backend

  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8080

# ── Lecturer-Backend proxy ─────────────────────────────────────────────────
lecturer:
  base-url: ${LECTURER_BASE_URL:http://localhost:8084}

# ── JWT settings ────────────────────────────────────────────────────────────
jwt:
  secret: ${JWT_SECRET:reg-backend-dev-jwt-secret-change-in-production}
  access-token-expiry-ms: 900000       # 15 minutes
  refresh-token-expiry-ms: 604800000   # 7 days

# ── OTP settings ────────────────────────────────────────────────────────────
otp:
  secret: ${OTP_SECRET:reg-backend-dev-otp-secret-change-in-production}
  expiry-minutes: 10
  resend-cooldown-seconds: 60
  max-sends-per-hour: 5
  max-verify-attempts: 5
  # Set to true ONLY in local dev to include raw OTP in response
  show-in-dev: ${OTP_SHOW_IN_DEV:false}

# ── File upload ──────────────────────────────────────────────────────────────
file:
  upload:
    dir: uploads

# ── Set password ────────────────────────────────────────────────────────────
set-password:
  url: ${SET_PASSWORD_URL:http://localhost:5176/set-password}

# REG_UCD_001 — Actuator: expose health endpoint for internal deployment checks only.
# The public health check is served by HealthController at /api/health.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
