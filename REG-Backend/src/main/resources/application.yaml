spring:
  application:
    name: REG-Backend

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8082

# ── Lecturer-Backend proxy ─────────────────────────────────────────────────
lecturer:
  base-url: ${LECTURER_BASE_URL:http://localhost:8084}

# ── NAP program catalog sync ────────────────────────────────────────────────
nap:
  base-url: ${NAP_BASE_URL:http://localhost:8080}
  endpoint: ${NAP_PROGRAMS_ENDPOINT:/api/v1/programs}
  college: ${NAP_DEFAULT_COLLEGE:Alvin University}
  sync-interval-ms: ${NAP_SYNC_INTERVAL_MS:3600000}   # 1 hour

# ── JWT settings ────────────────────────────────────────────────────────────
jwt:
  secret: ${JWT_SECRET}
  access-token-expiry-ms: 900000       # 15 minutes
  refresh-token-expiry-ms: 604800000   # 7 days

# ── OTP settings ────────────────────────────────────────────────────────────
otp:
  secret: ${OTP_SECRET}
  expiry-minutes: 10
  resend-cooldown-seconds: 60
  max-sends-per-hour: 5
  max-verify-attempts: 5
  # Set to true ONLY in local dev to include raw OTP in response
  show-in-dev: ${OTP_SHOW_IN_DEV:false}

# ── File upload ──────────────────────────────────────────────────────────────
file:
  upload:
    dir: uploads

# ── Set password ────────────────────────────────────────────────────────────
set-password:
  url: ${SET_PASSWORD_URL:http://localhost:5176/set-password}

# REG_UCD_001 — Actuator: expose health endpoint for internal deployment checks only.
# The public health check is served by HealthController at /api/health.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
